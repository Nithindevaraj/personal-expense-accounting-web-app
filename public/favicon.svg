<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Squircloid Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Card sticking out -->
  <rect x="18" y="14" width="28" height="14" rx="3" fill="#a7f3d0" />

  <!-- Wallet Body with Shadow -->
  <g filter="url(#shadow)">
    <rect x="12" y="20" width="40" height="30" rx="6" fill="#ffffff" />
  </g>

  <!-- Wallet Bottom Crease / Pocket Line -->
  <path d="M12 36 h40 v8 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 v-8 z" fill="#f8fafc" />
  <line x1="12" y1="36" x2="52" y2="36" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Clasp Strap -->
  <rect x="38" y="29" width="16" height="12" rx="4" fill="url(#claspGrad)" />
  <circle cx="48" cy="35" r="2.2" fill="#fbbf24" />
</svg>
